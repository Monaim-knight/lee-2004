name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        r-version: ['4.1', '4.2', '4.3']
      fail-fast: false

    steps:
    - uses: actions/checkout@v3

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install r.project --version ${{ matrix.r-version }} -y

    - name: Install renv
      run: |
        install.packages("renv", repos = "https://cloud.r-project.org")
      shell: Rscript {0}

    - name: Restore renv
      run: |
        renv::restore()
      shell: Rscript {0}

    - name: Run analysis
      run: |
        source("run_all.R")
      shell: Rscript {0}

    - name: Run tests
      run: |
        source("tests/test_rd.R")
      shell: Rscript {0}

    - name: Upload outputs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: outputs-${{ matrix.os }}-r${{ matrix.r-version }}
        path: |
          outputs/
          data/processed/
        retention-days: 7

    - name: Check for errors
      run: |
        if (file.exists("outputs/tables/all_rd_models_summary.csv")) {
          message("Analysis completed successfully")
        } else {
          stop("Analysis failed - outputs not generated")
        }
      shell: Rscript {0}


